<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>503 Service Temporarily Unavailable - PhotoNotes</title>
  <style>
    body {
      background: #0b0f19;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 36px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .status-code {
      font-size: 3rem;
      font-weight: 800;
      color: #ff9900;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 16px;
    }
    p {
      color: #9ca3af;
      line-height: 1.5;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }
    .btn {
      display: inline-block;
      background: #ff9900;
      color: #0b0f19;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-code">503</div>
    <h1>Database Failover in Progress</h1>
    <p>The application is temporarily unable to reach the database backend. An Amazon RDS Multi-AZ failover or maintenance cycle may be in progress. Please refresh in a few moments.</p>
    <a href="/" class="btn">Retry Request</a>
  </div>
</body>
</html>
